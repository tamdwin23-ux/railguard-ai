name: RailGuard CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: |
          python -m py_compile \
            app/main.py \
            app/model_service.py \
            app/risk_engine.py \
            app/feature_engine.py \
            app/explainer.py \
            app/drift_monitor.py \
            app/s3_service.py \
            app/n8n_service.py

      - name: Build Docker image
        run: docker build -t railguard-ai:ci .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate -no-color

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate

    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::443920089735:role/RailGuardGitHubDeployRole
          aws-region: eu-north-1

      - name: Deploy RailGuard through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0e9b285cb2a403781" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy RailGuard AI from GitHub Actions" \
            --parameters 'commands=["bash /home/ec2-user/railguard-ai/scripts/deploy_ec2.sh"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0e9b285cb2a403781"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0e9b285cb2a403781" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
